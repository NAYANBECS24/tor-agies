<!DOCTYPE html>
<html lang="en">
  <head>

      content="TOR-AEGIS is an explainable dark-web threat actor intelligence platform that combines public Tor network intelligence, infrastructure analysis, entity resolution, stylometry, blockchain intelligence and evidence fusion for analyst-reviewed attribution."
    />
    <meta
      name="keywords"
      content="TOR-AEGIS, Dark Web Threat Intelligence, Threat Actor Attribution, Tor Network Intelligence, Onionoo, A.E.G.I.S., OSINT, Cyber Forensics, Entity Resolution, Stylometry, Blockchain Intelligence, Evidence Graph, NTRO PS-26151"
    />
    <meta name="author" content="TOR-AEGIS Development Team" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="X-Frame-Options" content="DENY" />
    <meta http-equiv="X-XSS-Protection" content="1; mode=block" />
    
    <title>TOR-AEGIS | Dark Web Threat Actor Intelligence & Attribution</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
          crossorigin=""/>
    
    <!-- Fonts -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons" />
    
    <style>
      /* Reset and base styles */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
          'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
          sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        background-color: #0a1929;
        color: white;
        overflow-x: hidden;
      }
      
      #root {
        min-height: 100vh;
      }

      /* Loading screen styles */
      #loading-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(135deg, #0a1929 0%, #132f4c 100%);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 9999;
        color: white;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        text-align: center;
        transition: opacity 0.5s ease;
      }
      
      .loading-spinner {
        border: 4px solid rgba(255, 255, 255, 0.3);
        border-radius: 50%;
        border-top: 4px solid #1976d2;
        width: 60px;
        height: 60px;
        animation: spin 1s linear infinite;
        margin-bottom: 30px;
        box-shadow: 0 0 20px rgba(25, 118, 210, 0.3);
      }
      
      .loading-glow {
        position: absolute;
        width: 100px;
        height: 100px;
        background: radial-gradient(circle, #1976d2 0%, transparent 70%);
        border-radius: 50%;
        opacity: 0.3;
        animation: pulse 2s ease-in-out infinite;
      }
      
      #loading-screen h1 {
        font-size: 3rem;
        margin-bottom: 15px;
        background: linear-gradient(45deg, #1976d2, #42a5f5);
        background-clip: text;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        font-weight: bold;
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
      }
      
      #loading-screen .subtitle {
        font-size: 1.2rem;
        color: #b0bec5;
        margin-bottom: 5px;
      }
      
      #loading-screen .version {
        font-size: 0.9rem;
        color: #90a4ae;
        margin-top: 20px;
      }
      
      .loading-progress {
        width: 300px;
        margin-top: 30px;
      }
      
      .progress-bar {
        height: 4px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 2px;
        overflow: hidden;
      }
      
      .progress-fill {
        height: 100%;
        background: linear-gradient(90deg, #1976d2, #42a5f5);
        width: 0%;
        animation: loading 2s ease-in-out infinite;
        border-radius: 2px;
      }
      
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      
      @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 0.3; }
        50% { transform: scale(1.1); opacity: 0.5; }
      }
      
      @keyframes loading {
        0% { width: 0%; }
        50% { width: 70%; }
        100% { width: 100%; }
      }
      
      /* Custom scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      
      ::-webkit-scrollbar-track {
        background: rgba(255, 255, 255, 0.05);
        border-radius: 4px;
      }
      
      ::-webkit-scrollbar-thumb {
        background: rgba(25, 118, 210, 0.5);
        border-radius: 4px;
      }
      
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(25, 118, 210, 0.7);
      }
    </style>
  <script defer src="/static/js/bundle.js"></script></head>
  <body>

        position: fixed;

        display: flex;
        flex-direction: column;

      ">
        <div style="margin-bottom: 30px;">

        </div>
        <div style="max-width: 600px;">
          <p style="font-size: 1.2rem; margin-bottom: 15px; line-height: 1.6;">
            TOR-AEGIS requires JavaScript to function properly. This enables:
          </p>
          <ul style="text-align: left; margin-bottom: 25px; padding-left: 20px;">
            <li style="margin-bottom: 10px;">Public Tor network intelligence and historical analysis</li>
            <li style="margin-bottom: 10px;">A.E.G.I.S. evidence fusion and analyst-reviewed attribution</li>
            <li style="margin-bottom: 10px;">Case, evidence and report management</li>

          <p style="color: #b0bec5; font-size: 1rem;">

          </p>
          <div style="margin-top: 30px; padding: 20px; background: rgba(255, 255, 255, 0.05); border-radius: 10px;">
            <p style="color: #90a4ae; font-size: 0.9rem; margin: 0;">
              <strong>Note:</strong> This platform is intended for authorized cybersecurity, research and investigative use. Access, collection and processing must follow applicable law, organizational policy and approved authorization procedures.
            </p>
          </div>
        </div>
      </div>
    </noscript>
    
    <!-- Loading Screen -->
    <div id="loading-screen">
      <div class="loading-glow"></div>
      <div class="loading-spinner"></div>
      <h1>🔒 TOR-AEGIS</h1>
      <p class="subtitle">Dark Web Threat Actor Intelligence & Attribution Platform</p>
      <p class="subtitle">A.E.G.I.S. — Attribution, Evidence Graph & Intelligence System</p>
      <div class="loading-progress">
        <div class="progress-bar">
          <div class="progress-fill"></div>
        </div>
      </div>
      <p class="version">TOR-AEGIS 3.0 | Initializing Intelligence Platform...</p>
    </div>
    
    <!--
      TOR-AEGIS
      Dark Web Threat Actor Intelligence & Attribution Platform
      A.E.G.I.S. = Attribution, Evidence Graph & Intelligence System
      Scope: public Tor network intelligence, OSINT, infrastructure/entity analysis,
      stylometry, blockchain intelligence, evidence fusion and analyst review.
    -->
    <div id="root"></div>
    
    <!-- React Dependencies -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Socket.IO -->
    <script src="https://cdn.socket.io/4.6.0/socket.io.min.js"></script>
    
    <!-- Axios -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    
    <!-- D3.js -->
    <script src="https://d3js.org/d3.v7.min.js"></script>
    
    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
            crossorigin=""></script>
    
    <!-- Three.js -->
    <script src="https://unpkg.com/three@0.158.0/build/three.min.js"></script>
    
    <!-- Main Application Script -->
    <script>
      // Hide loading screen safely when React app mounts or loads
      function hideLoader() {
        var loadingScreen = document.getElementById('loading-screen');
        if (loadingScreen && loadingScreen.style.display !== 'none') {
          loadingScreen.style.opacity = '0';
          setTimeout(function() {
            loadingScreen.style.display = 'none';
          }, 300);
        }
      }
      window.addEventListener('DOMContentLoaded', function() { setTimeout(hideLoader, 600); });
      window.addEventListener('load', function() { setTimeout(hideLoader, 300); });
      setTimeout(hideLoader, 2000); // Fallback guarantee
    </script>
  </body>
</html>
